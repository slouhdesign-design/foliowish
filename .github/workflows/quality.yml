name: Quality Gate

on:
  push:
    branches: [main, prelaunch]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static QA
        run: npm run qa
      - name: JavaScript syntax
        run: |
          node --check js/editor-data.js
          node --check js/editor-render.js
          node --check js/editor-actions.js
          node --check js/editor.js
