name: Quality Gate

on:
  push:
    branches: [main, prelaunch]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Runner smoke check
        run: |
          echo "runner-started"
          node --version
          git --version
      - name: Checkout without marketplace actions
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Static QA
        run: npm run qa
      - name: JavaScript syntax
        run: |
          node --check js/editor-data.js
          node --check js/editor-render.js
          node --check js/editor-actions.js
          node --check js/editor.js
