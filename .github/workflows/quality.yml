name: Quality Gate
on:
  push:
    branches: [main, prelaunch]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run qa
      - run: node --check js/editor-data.js
      - run: node --check js/editor-render.js
      - run: node --check js/editor-actions.js
      - run: node --check js/editor.js
